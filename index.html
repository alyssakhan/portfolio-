<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alyssa Khan</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Stays in the head: sets the theme before the page paints (no flash) -->
  <script>
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
  </script>
</head>

<body>

  <header>
    <nav class="navbar">
      <div class="nav-logo">MyPortfolio</div>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><button id="theme-toggle" aria-label="Toggle dark mode">🌚</button></li>
      </ul>
    </nav>
  </header>

  <div class="hero">
    <h1>Welcome to My Portfolio</h1>
    <p class="tagline">Showcasing my learnings and projects</p>
  </div>

  <main>
    <section id="about">
      <h2>About Me</h2>
      <p>Hey! I'm not sure what to add here yet! </p>
    </section>

    <section id="projects">
      <h2>Past Learnings &amp; Projects</h2>

      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="All">All</button>
        <button class="filter-btn" data-filter="Coding">Coding</button>
        <button class="filter-btn" data-filter="Design">Design</button>
      </div>

      <div class="card-grid" id="project-grid"></div>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <ul class="skills-list">
        <li>HTML</li>
        <li>CSS</li>
        <li>Python</li>
      </ul>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <ul class="contact-list">
        <li><a href="https://github.com/alyssakhan">GitHub</a></li>
        <li><a href="https://canva.link/khanresume">Resume</a></li>
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; Khan 2026</p>
  </footer>

  <!-- Moved to the end of the body so the elements exist when it runs -->
  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');
    const navbar = document.querySelector('.navbar');

    const syncIcon = () =>
      toggle.textContent = root.dataset.theme === 'dark' ? '🌝' : '🌚';
    syncIcon();

    toggle.addEventListener('click', () => {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', root.dataset.theme);
      syncIcon();
    });

    // Stronger shadow once the page is scrolled
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 10);
    });

    // Highlight the nav link for the section in view
    const links = document.querySelectorAll('.nav-links a[href^="#"]');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          links.forEach(l =>
            l.classList.toggle('active', l.getAttribute('href') === '#' + entry.target.id));
        }
      });
    }, { rootMargin: '-40% 0px -55% 0px' });

    document.querySelectorAll('section[id]').forEach(s => observer.observe(s));

    // --- Project data ---
    const projects = [
      {
        title: 'Project One',
        description: 'This was the first website I coded! It has some fun moving features.',
        url: 'https://alyssakhan.neocities.org',
        category: 'Coding'
      },
      {
        title: 'Project Two',
        description: 'This is a mini game I coded as a prototype for a workshop that I am leading.',
        url: 'https://trinket.strivemath.org/html/b581208ff65b?outputOnly=true',
        category: 'Coding'
      },
      {
        title: 'Project Three',
        description: 'TBD',
        url: '#',
        category: 'Design' // change this to match the real project
      }
    ];

    const grid = document.getElementById('project-grid');
    const filterBar = document.getElementById('filter-bar');
    const filterButtons = document.querySelectorAll('.filter-btn');

    // --- Build one card and add it to the page ---
    function createCard(project, index) {
      const card = document.createElement('article');
      card.className = 'card project-card fade-in';
      card.style.animationDelay = `${index * 80}ms`; // stagger the cards

      card.innerHTML = `
        <h3>${project.title}</h3>
        <p>${project.description}</p>
        <a href="${project.url}" class="card-btn">View Project &rarr;</a>
      `;
      grid.appendChild(card);
    }

    // --- Clear the grid, then re-draw only the matching projects ---
    function renderProjects(category) {
      grid.innerHTML = ''; // removes all existing cards

      const visible = category === 'All'
        ? projects
        : projects.filter(p => p.category === category);

      if (visible.length === 0) {
        grid.innerHTML = `<p class="empty-message">Nothing in ${category} yet, check back soon!</p>`;
        return;
      }

      visible.forEach((project, index) => createCard(project, index));
    }

    // --- Handle filter clicks (one listener on the bar, not one per button) ---
    filterBar.addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;

      filterButtons.forEach(b => b.classList.toggle('active', b === btn));
      renderProjects(btn.dataset.filter);
    });

    // Show everything on first load
    renderProjects('All');
  </script>
</body>
</html>
